name: Live site check
# Once a day: https://merchants.evitaas.com is up and serves what is on main. GitHub emails the owner if it fails.
on:
  schedule:
    - cron: "17 3 * * *"         # 08:47 IST
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd tests && npm run live
